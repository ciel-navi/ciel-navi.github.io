<svg width="720" height="560" viewBox="0 0 720 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line{stroke:#111827;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .soft{stroke:#6b7280;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .gold{stroke:#c49018;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .card{fill:#fff;stroke:#111827;stroke-width:2.2}
    .dot{fill:#111827}
    .pale{fill:#f2f0ea}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes floatB{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(10px) translateX(-8px)}}
    @keyframes drawPulse{0%,100%{opacity:.38}50%{opacity:1}}
    @keyframes sweep{0%{stroke-dashoffset:420}100%{stroke-dashoffset:0}}
    #card-main{animation:floatA 5.6s ease-in-out infinite;transform-origin:center}
    #card-side{animation:floatB 6.8s ease-in-out infinite;transform-origin:center}
    #path-signal{stroke-dasharray:420;animation:sweep 7s ease-in-out infinite alternate}
    #sparkles circle{animation:drawPulse 3.2s ease-in-out infinite}
    #sparkles circle:nth-child(2n){animation-delay:.8s}
    #sparkles circle:nth-child(3n){animation-delay:1.4s}
  </style>
  <rect x="72" y="72" width="520" height="390" rx="54" class="pale"/>
  <path id="path-signal" d="M96 386C188 292 229 172 341 186C447 199 455 336 585 235" class="soft"/>
  <g id="sparkles">
    <circle cx="551" cy="101" r="4" class="dot"/>
    <circle cx="582" cy="128" r="3" class="dot"/>
    <circle cx="516" cy="143" r="3.5" class="dot"/>
    <circle cx="611" cy="185" r="3" class="dot"/>
    <circle cx="540" cy="212" r="3.5" class="dot"/>
    <circle cx="592" cy="258" r="3" class="dot"/>
  </g>
  <g id="card-side">
    <rect x="384" y="128" width="188" height="136" rx="30" class="card"/>
    <path d="M425 180H531" class="line"/>
    <path d="M425 218H496" class="soft"/>
    <circle cx="425" cy="146" r="5" class="dot"/>
    <circle cx="446" cy="146" r="5" class="dot"/>
    <circle cx="467" cy="146" r="5" class="dot"/>
  </g>
  <g id="card-main">
    <rect x="142" y="194" width="284" height="216" rx="42" class="card"/>
    <path d="M196 262H359" class="line"/>
    <path d="M196 314H304" class="soft"/>
    <path d="M196 353H336" class="soft"/>
    <circle cx="190" cy="223" r="6" class="dot"/>
    <circle cx="216" cy="223" r="6" class="dot"/>
    <circle cx="242" cy="223" r="6" class="dot"/>
    <path d="M360 252L381 273L420 224" class="gold"/>
  </g>
  <path d="M108 458C178 500 306 509 417 476C510 448 579 386 630 308" class="soft"/>
  <path d="M88 150C127 119 175 103 230 102" class="gold"/>
  <path d="M102 178C154 136 214 124 282 139" class="soft"/>
</svg>
