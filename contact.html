    "name": "お問い合わせ",
    "url": "https://cielsaloon.com/contact.html",
    "mainEntity": {
      "@type": "Organization",
      "name": "株式会社シエル",
      "email": "ciel.kk.info@gmail.com",
      "url": "https://cielsaloon.com/"
    }
  }
  </script>

<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo-lockup">
        <img src="symbol.png" class="logo-symbol" alt="" aria-hidden="true">
        <span class="logo-wordmark">Ciel</span>
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="company.html">Company</a>
        <a href="business.html">Business</a>
        <a href="apps.html">App</a>
        <a href="lp.html">LP</a>
        <a href="insole.html">Insole</a>
        <a href="contact.html" class="nav-active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-hero">
    <div class="container section-heading fade-up">
      <span class="section-kicker">Contact</span>
      <h1>お問い合わせ</h1>
      <p class="page-lead">制作、開発、AI活用、インソールに関する相談を受け付けています。内容が固まっていない段階でも大丈夫です。</p>
    </div>
  </main>

  <section class="contact-page page-section">
    <div class="container">
      <div class="contact-layout">
        <div class="contact-card fade-up">
          <span class="section-kicker">Mail</span>
          <p>フォームが開けない場合は、下記メールアドレスまで直接ご連絡ください。</p>
          <a href="mailto:ciel.kk.info@gmail.com" class="contact-email contact-email--light">ciel.kk.info@gmail.com</a>
        </div>
        <form class="contact-form fade-up" action="mailto:ciel.kk.info@gmail.com" method="post" enctype="text/plain">
          <label>
            <span>お名前</span>
            <input type="text" name="name" autocomplete="name" placeholder="任意">
          </label>
          <label>
            <span>メールアドレス</span>
            <input type="email" name="email" autocomplete="email" required placeholder="example@email.com">
          </label>
          <label>
            <span>相談内容</span>
            <select name="category" required>
              <option value="">選択してください</option>
              <option value="アプリ開発">アプリ開発</option>
              <option value="LP制作">LP制作</option>
              <option value="AI・デジタル支援">AI・デジタル支援</option>
              <option value="インソール">インソール</option>
              <option value="その他">その他</option>
            </select>
          </label>
          <label>
            <span>予算感</span>
            <select name="budget">
              <option value="未定">未定</option>
              <option value="3万円〜10万円">3万円〜10万円</option>
              <option value="10万円〜30万円">10万円〜30万円</option>
              <option value="30万円以上">30万円以上</option>
            </select>
          </label>
          <label class="form-wide">
            <span>お問い合わせ内容</span>
            <textarea name="message" rows="7" required placeholder="作りたいもの、困っていること、希望時期などを入力してください。"></textarea>
          </label>
          <button type="submit" class="primary-link form-submit">送信する</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2025 Ciel</p>
    </div>
  </footer>
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  </script>
</body>
